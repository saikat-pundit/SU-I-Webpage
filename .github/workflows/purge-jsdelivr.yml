name: Purge jsDelivr Cache

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  list-files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/trees/${{ github.ref_name }}?recursive=1" \
            | grep -oP '"path":\s*"\K[^"]+\.(css|html|js)"' | tr -d '"' \
            | awk 'NF' | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

  purge:
    needs: list-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        file: ${{ fromJson(needs.list-files.outputs.files) }}
    steps:
      - name: Purge ${{ matrix.file }}
        run: |
          URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/${{ matrix.file }}"
          RESPONSE=$(curl -s "$URL")
          if echo "$RESPONSE" | grep -q '"throttled":\s*false'; then
            echo "✅ ${{ matrix.file }}"
          elif echo "$RESPONSE" | grep -q '"throttled":\s*true'; then
            RESET=$(echo "$RESPONSE" | grep -oP '"throttlingReset":\s*\K\d+')
            echo "⏳ ${{ matrix.file }} (throttled, reset in ${RESET}s)"
            exit 1
          else
            echo "❌ ${{ matrix.file }}"
            echo "$RESPONSE"
            exit 1
          fi
